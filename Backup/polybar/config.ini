[colors]
bg-pill       = #1e1e2e
fg-main       = #d1ca9d
fg-dim        = #565869
accent-pink   = #b4befe
accent-purple = #b19cd9
transparent   = #00000000

[bar/base]
monitor = 
height = 22pt
radius = 9.0
background = ${colors.bg-pill}
foreground = ${colors.fg-main}
bottom = false
border-size = 1 pt
border-color = #899fc9
padding-left = 2
padding-right = 2
#module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=9.5;3"
font-1 = "FontAwesome:size=10;3"
cursor-click = pointer
enable-ipc = true
ipc-handler = true
offset-y = 3pt
override-redirect = true
wm-restack = i3
font-2 = "JetBrainsMono Nerd Font:size=9.5;3"
font-3 = "Font Awesome 6 Free Solid:size=10;3"
font-4 = "Material Design Icons Desktop:size=10;3"


[bar/left-pill]
inherit = bar/base
width = 28%
offset-x = 0.5%
# Swap out the 'workspaces' module for 4 independent static modules
modules-left = left-bracket rofi pipe workspaces xwindow running-apps 


[bar/center-pill]
inherit = bar/base
width = 12%
offset-x = 44%
modules-center = datetime

[bar/sys-pill]
inherit = bar/base
width = 10%
offset-x = 67.1%
modules-center = sys-stats

[bar/right-pill]
inherit = bar/base
width = 22%
offset-x = 77.5%
modules-center = left-bracket tray backlight pulseaudio system-menu right-bracket

[module/workspaces]
type = custom/script
# Point this to exactly where you saved the file
exec = ~/.config/polybar/workspaces.py
# Must be true so it listens to the script's live updates
tail = true
format-margin-right = 4px

[module/xwindow]
type = internal/xwindow
label = " | %title%"
label-maxlen = 12
label-empty = " | Desktop"
label-foreground = ${colors.fg-main}

[module/launcher-term]
type = custom/text
format = " 󰆍 "
format-foreground = ${colors.accent-pink}
click-left = x-terminal-emulator &

[module/launcher-web]
type = custom/text
format = " 󰈹 "
format-foreground = #fab387
click-left = firefox &

[module/launcher-files]
type = custom/text
format = " 󰉋 "
format-foreground = #a6e3a1
click-left = thunar &

[module/sys-stats]
type = custom/script
interval = 2
exec = cpu=$(top -bn1 | grep "Cpu(s)" | awk '{print int(100 - $8)}'); ram=$(free -m | awk 'NR==2{printf "%.1fG", $3/1024}'); echo "%{F#b4befe}󰍛%{F-} ${cpu}%  %{F#b4befe}󰘚%{F-} ${ram}"
format = <label>
label = "[%output%]"



[module/tray]
type = internal/tray
tray-spacing = 2px
tray-size = 16px

[module/datetime]
type = internal/date
interval = 1.0

# Grayblocks style date/time format
time = " %I:%M %p"
time-alt = " %a, %d %b %Y"

format = <label>
format-background = ${colors.bg-pill}
format-foreground = ${colors.fg-main}

label = "[ %{T3}%time%%{T} ]"

[module/system-menu]
type = custom/text
format = "  "
format-foreground = ${colors.accent-pink}
click-left = ~/.config/rofi/powermenu.sh

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = "%percentage%% |"
ramp-volume-0 = "| %{F#b4befe}%{F-}"
ramp-volume-1 = "| %{F#b4befe}%{F-}"
ramp-volume-2 = "| %{F#b4befe}%{F-}"
label-muted = "| 󰝟 |"
click-right = pavucontrol &

[module/backlight]
type = custom/script
exec = exec brightnessctl -m | cut -d, -f4
interval = 1
format = <label>
label = " | %{F#b19cd9}󰃠%{F-} %output% "
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-


[module/running-apps]
type = custom/script
exec = python3 ~/.config/polybar/taskbar.py
interval = 1
format = <label>
label = "| %output% ]"


[module/left-bracket]
type = custom/text
format = "[ "
format-foreground = ${colors.fg-main}


[module/right-bracket]
type = custom/text
format = " ]"
format-foreground = ${colors.fg-main}

[module/rofi]
type = custom/text
format = " "
format-foreground = ${colors.accent-pink}
click-left = rofi -show drun

[module/pipe]
type = custom/text
format = "| "
format-foreground = ${colors.fg-main}
